[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darktable-mcp"
version = "0.5.0"
description = "MCP server for AI-powered photo editing — delegates RAW rendering to darktable-cli when available"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Yadullah Abidi", github = "YaddyVirus" },
    { name = "Yuri Schmaltz",  github = "yuri-schmaltz" },
]
dependencies = [
    "mcp>=1.0.0",
    "rawpy>=0.18.0; platform_system != 'Darwin' or python_version < '3.13'",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.entry-points."darktable_mcp.presets"]
# No external presets registered by default; the ``DARKTABLE_MCP_PRESETS``
# env var is the recommended extension point.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.350",
    "rawpy>=0.18.0",
]
raw = [
    # rawpy is the fallback RAW decoder; required only if you want to render
    # RAW without darktable-cli installed.
    "rawpy>=0.18.0",
]

[project.scripts]
darktable-mcp = "darktable_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darktable_mcp"]
include = ["presets/*.json"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
