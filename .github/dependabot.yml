version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      runtime:
        patterns:
          - "mcp"
          - "rawpy"
          - "Pillow"
          - "numpy"
      dev:
        patterns:
          - "pytest*"
          - "pyright"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
